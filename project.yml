name: Bani
options:
  projectFormat: xcode16_0
  deploymentTarget:
    iOS: "26.0"
  bundleIdPrefix: com.dumi.bani
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
packages:
  argmax-oss-swift:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    branch: main
  # v1.1 Excel/CSV history import — the ONE documented new-dependency exception.
  # CoreXLSX reads .xlsx (a zipped OOXML archive) natively in Swift; CSV is parsed
  # with Foundation only. Pinned to exact 0.14.2 (see build-notes.md for the pin
  # justification). Adding this package changes project.yml, the CI cache key, so
  # one cold-cache resolve/build cycle is expected on this run.
  CoreXLSX:
    url: https://github.com/CoreOffice/CoreXLSX.git
    exactVersion: "0.14.2"
targets:
  Bani:
    type: application
    platform: iOS
    sources:
      - path: Bani
        type: syncedFolder
    dependencies:
      - package: argmax-oss-swift
        product: WhisperKit
      - package: CoreXLSX
        product: CoreXLSX
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.dumi.bani.Bani
        PRODUCT_NAME: Bani
        MARKETING_VERSION: "1.0"
        # CFBundleVersion is derived from the CI run number. Locally / on PRs it
        # defaults to 1; the `ipa` release build passes CI_BUILD_NUMBER=<run>
        # on the xcodebuild command line (highest precedence), so every
        # published build is a distinct, monotonically-increasing CFBundleVersion
        # ("1.0 (247)") that AltStore treats as newer via its buildVersion check.
        CI_BUILD_NUMBER: "1"
        CURRENT_PROJECT_VERSION: "$(CI_BUILD_NUMBER)"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The app icon lives in Assets.xcassets/AppIcon.appiconset (single-size
        # 1024 iOS icon). Naming it here is what makes actool emit CFBundleIcons +
        # the icon into the bundle; without it the installed app has a blank icon
        # even though AltStore shows docs/icon.png.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Bani uses the microphone to record your voice so you can log expenses by speaking."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
  BaniTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BaniTests
        type: syncedFolder
    dependencies:
      - target: Bani
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.dumi.bani.BaniTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bani.app/Bani"
        BUNDLE_LOADER: "$(TEST_HOST)"
  BaniUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BaniUITests
        type: syncedFolder
    dependencies:
      - target: Bani
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.dumi.bani.BaniUITests
        TEST_TARGET_NAME: Bani
schemes:
  Bani:
    build:
      targets:
        Bani: all
        BaniTests: [test]
        BaniUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - BaniTests
        - BaniUITests
    run:
      config: Debug
    archive:
      config: Release
