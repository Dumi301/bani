name: Bani
options:
  projectFormat: xcode16_0
  deploymentTarget:
    iOS: "26.0"
  bundleIdPrefix: com.dumi.bani
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
packages:
  argmax-oss-swift:
    url: https://github.com/argmaxinc/argmax-oss-swift.git
    branch: main
targets:
  Bani:
    type: application
    platform: iOS
    sources:
      - path: Bani
        type: syncedFolder
    dependencies:
      - package: argmax-oss-swift
        product: WhisperKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.dumi.bani.Bani
        PRODUCT_NAME: Bani
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Bani uses the microphone to log your expenses by voice."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
  BaniTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BaniTests
        type: syncedFolder
    dependencies:
      - target: Bani
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.dumi.bani.BaniTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Bani.app/Bani"
        BUNDLE_LOADER: "$(TEST_HOST)"
  BaniUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BaniUITests
        type: syncedFolder
    dependencies:
      - target: Bani
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.dumi.bani.BaniUITests
        TEST_TARGET_NAME: Bani
schemes:
  Bani:
    build:
      targets:
        Bani: all
        BaniTests: [test]
        BaniUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - BaniTests
        - BaniUITests
    run:
      config: Debug
    archive:
      config: Release
