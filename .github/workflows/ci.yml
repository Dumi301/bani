name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Runner image carrying Xcode 26 / iOS 26 SDK. If this label is invalid on the
  # account, the first run fails fast at queue time — flip to macos-15/macos-latest.
  MACOS_IMAGE: macos-26

jobs:
  # ── STAGE 1 — GATE ──────────────────────────────────────────────────────────
  # Cheapest signal first: xcodegen + build + ALL unit tests (no UI, no whisper,
  # no ipa). A compile error or a failing unit test stops here and NEVER triggers
  # the expensive UI / whisper / ipa / release chain below (all `needs: [gate]`).
  gate:
    name: gate (build + unit tests)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode_2*.app 2>/dev/null | sort -V | tail -1); fi
          echo "Selected Xcode: $XC"
          sudo xcode-select -s "$XC/Contents/Developer"

      - name: Toolchain discovery
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          echo "---- available simulators ----"
          xcrun simctl list devices available | sed -n '1,150p'
          echo "---- available SDKs ----"
          xcodebuild -showsdks | grep -i ios || true

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen --version
          VER=$(xcodegen --version | grep -Eo '[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1)
          MAJOR=$(echo "$VER" | cut -d. -f1); MINOR=$(echo "$VER" | cut -d. -f2)
          if [ "$MAJOR" -lt 2 ] || { [ "$MAJOR" -eq 2 ] && [ "$MINOR" -lt 42 ]; }; then
            echo "::error::XcodeGen $VER does not support syncedFolder (need >= 2.42)"; exit 1
          fi
          echo "XcodeGen $VER supports syncedFolder"

      # Cache-warm verification run: this comment-only change keeps project.yml (the
  # cache key input) identical, so the second run must restore the cache saved above.
  # gate carries the richest cache: SPM checkouts (SourcePackages) AND build
      # products under a fixed DerivedData path, so a warm gate reuses the compiled
      # WhisperKit dependency + prior build products instead of re-resolving and
      # recompiling from scratch. Keyed on project.yml (Package.resolved is not
      # committed — the argmax dep is branch-pinned — so project.yml is the stable
      # key; the extra Package.resolved glob picks it up if it is ever committed).
      - name: Cache SwiftPM + DerivedData
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            build/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: bani-dd-${{ runner.os }}-${{ hashFiles('project.yml', '**/Package.resolved') }}
          restore-keys: |
            bani-dd-${{ runner.os }}-

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(python3 .github/scripts/pick_sim.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator UDID: $UDID"

      - name: Build & unit test (no UI, no whisper)
        run: |
          set -o pipefail
          xcodebuild build test \
            -project Bani.xcodeproj \
            -scheme Bani \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:BaniTests \
            -skip-testing:BaniTests/WhisperServiceTests \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/build-test.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-test-result
          path: build/build-test.xcresult
          if-no-files-found: ignore

  # ── STAGE 2 — UI / screenshots ──────────────────────────────────────────────
  # Runs ONLY after gate is green. UI tests auto-retry once. A test that fails
  # BOTH attempts does NOT fail the workflow (screenshots + a FLAKY-REPORT are
  # still uploaded and a warning is surfaced) UNLESS it is in ManualEntryUITests,
  # which guards a real product contract and stays blocking. Screenshot capture
  # always runs so visual grading is never skipped.
  screenshots:
    name: screenshots (UI)
    needs: [gate]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode_2*.app 2>/dev/null | sort -V | tail -1); fi
          sudo xcode-select -s "$XC/Contents/Developer"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: |
            build/DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: bani-spm-${{ runner.os }}-${{ hashFiles('project.yml', '**/Package.resolved') }}
          restore-keys: |
            bani-spm-${{ runner.os }}-
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(python3 .github/scripts/pick_sim.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Run UI tests (retry once; does not abort the job)
        id: uitest
        run: |
          # UI tests share one cold simulator; retry only the tests that fail so a
          # first-launch / keyboard-focus flake self-heals. -test-iterations 2 with
          # -retry-tests-on-failure = one initial attempt + one retry (retry once).
          # set +e so a failing suite never aborts this step — the analyze step below
          # decides whether the failure blocks (ManualEntryUITests) or only warns.
          set +e
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project Bani.xcodeproj \
            -scheme Bani \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:BaniUITests \
            -retry-tests-on-failure \
            -test-iterations 2 \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/ui.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ui-test.log
          CODE=${PIPESTATUS[0]}
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "xcodebuild UI-test exit code: $CODE"
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p screenshots
          xcrun xcresulttool export attachments \
            --path build/ui.xcresult \
            --output-path screenshots || echo "attachment export skipped"
          ls -la screenshots || true
      - name: Analyze UI results (classify flaky vs blocking)
        id: analyze
        if: always()
        run: |
          set +e
          LOG=build/ui-test.log
          CODE="${{ steps.uitest.outputs.code }}"
          if [ ! -f "$LOG" ]; then
            echo "::error::UI-test log missing — xcodebuild did not produce output"
            echo "block=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A test that fails an attempt then passes on retry self-heals (allowed).
          # "Ultimately failed" = failed at least once AND never passed = failed all
          # attempts. Derived from the human-readable xcodebuild log so it is stable
          # across Xcode / xcresulttool format changes.
          grep -Eio "Test Case '-\[[^]]+\]' (failed|passed)" "$LOG" > build/tc.txt
          grep -Ei "failed$" build/tc.txt | grep -Eo "\[[^]]+\]" | tr -d '[]' | sort -u > build/failed.txt
          grep -Ei "passed$" build/tc.txt | grep -Eo "\[[^]]+\]" | tr -d '[]' | sort -u > build/passed.txt
          : > build/ultfail.txt
          comm -23 build/failed.txt build/passed.txt > build/ultfail.txt
          COUNT=$(grep -c . build/ultfail.txt || true)
          echo "Ultimately-failed UI tests (failed all attempts): ${COUNT:-0}"
          cat build/ultfail.txt || true

          # Clean pass: exit 0 AND nothing failed all attempts (self-healed flakes ok).
          if [ "$CODE" = "0" ] && [ "${COUNT:-0}" = "0" ]; then
            echo "block=0" >> "$GITHUB_OUTPUT"
            echo "### ✅ UI tests green (self-healed flakes allowed)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Nonzero exit with no identifiable failing test = a build/infra break, not
          # flakiness. That is not what the defang covers, so it blocks.
          if [ "$CODE" != "0" ] && [ "${COUNT:-0}" = "0" ]; then
            echo "block=1" >> "$GITHUB_OUTPUT"
            echo "::error::UI job failed (exit $CODE) with no identifiable flaky test — treated as a build/infra failure and BLOCKS."
            echo "### ❌ UI job build/infra failure (exit $CODE)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Build the FLAKY-REPORT: each test that failed both attempts + its messages.
          REPORT=build/FLAKY-REPORT.md
          {
            echo "# UI Test Flaky / Failure Report"
            echo ""
            echo "- Run: ${{ github.run_number }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- xcodebuild exit code: $CODE"
            echo "- Retry policy: -retry-tests-on-failure -test-iterations 2 (one retry)"
            echo ""
          } > "$REPORT"

          BLOCK=0
          while IFS= read -r TID; do
            [ -z "$TID" ] && continue
            CLASS=$(echo "$TID" | awk '{print $1}')
            METHOD=$(echo "$TID" | awk '{print $2}')
            echo "## ${CLASS} / ${METHOD} — failed both attempts" >> "$REPORT"
            echo "" >> "$REPORT"
            echo '```' >> "$REPORT"
            grep -F "$METHOD" "$LOG" | grep -Ei "error:|failed \(" | sed 's/^[[:space:]]*//' \
              | sort -u | head -20 >> "$REPORT" || echo "(no detailed failure message captured)" >> "$REPORT"
            echo '```' >> "$REPORT"
            echo "" >> "$REPORT"
            case "$CLASS" in
              *ManualEntryUITests*) BLOCK=1 ;;
            esac
          done < build/ultfail.txt

          echo "---- FLAKY-REPORT.md ----"
          cat "$REPORT"

          if [ "$BLOCK" = "1" ]; then
            echo "block=1" >> "$GITHUB_OUTPUT"
            echo "::error::ManualEntryUITests failed both attempts — guards a product contract, BLOCKS the pipeline."
            {
              echo "### ❌ Blocking UI failure: ManualEntryUITests"
              echo "A ManualEntryUITests case failed both attempts. See the FLAKY-REPORT artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "block=0" >> "$GITHUB_OUTPUT"
            echo "::warning::${COUNT} UI test(s) failed both attempts but are non-blocking (not ManualEntryUITests). Screenshots + FLAKY-REPORT uploaded; pipeline continues."
            {
              echo "### ⚠️ Non-blocking UI flake"
              echo "${COUNT} UI test(s) failed both attempts (none in ManualEntryUITests). Pipeline continues. See the FLAKY-REPORT artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            screenshots
            build/ui.xcresult
          if-no-files-found: warn
      - name: Upload FLAKY-REPORT
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FLAKY-REPORT
          path: |
            build/FLAKY-REPORT.md
            build/ui-test.log
          if-no-files-found: ignore
      - name: Enforce ManualEntry contract (block only on real product-contract failure)
        if: always()
        run: |
          if [ "${{ steps.analyze.outputs.block }}" = "1" ]; then
            echo "Blocking failure detected in the UI job — failing screenshots (and thus release)."
            exit 1
          fi
          echo "UI job passing (green, or non-blocking flake only)."

  # ── STAGE 2 — model tests (non-blocking, reported) ──────────────────────────
  whisper-tests:
    name: whisper-tests (model)
    needs: [gate]
    runs-on: macos-26
    continue-on-error: true   # non-blocking but reported; skips explicitly if model unavailable
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode_2*.app 2>/dev/null | sort -V | tail -1); fi
          sudo xcode-select -s "$XC/Contents/Developer"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: |
            build/DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: bani-spm-${{ runner.os }}-${{ hashFiles('project.yml', '**/Package.resolved') }}
          restore-keys: |
            bani-spm-${{ runner.os }}-
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/whisperkit
          key: whisper-openai_whisper-small-v1
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Pick simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(python3 .github/scripts/pick_sim.py)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Run WhisperService tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Bani.xcodeproj \
            -scheme Bani \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -only-testing:BaniTests/WhisperServiceTests \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/whisper.xcresult \
            CODE_SIGNING_ALLOWED=NO

  # ── STAGE 2 — unsigned IPA ──────────────────────────────────────────────────
  ipa:
    name: ipa (unsigned)
    needs: [gate]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode_2*.app 2>/dev/null | sort -V | tail -1); fi
          sudo xcode-select -s "$XC/Contents/Developer"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: |
            build/DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: bani-spm-${{ runner.os }}-${{ hashFiles('project.yml', '**/Package.resolved') }}
          restore-keys: |
            bani-spm-${{ runner.os }}-
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Archive (unsigned, device)
        run: |
          set -o pipefail
          # CI_BUILD_NUMBER (command-line, highest precedence) overrides the
          # project.yml default of 1, so CFBundleVersion == the CI run number.
          xcodebuild archive \
            -project Bani.xcodeproj \
            -scheme Bani \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/Bani.xcarchive \
            -derivedDataPath build/DerivedData \
            CI_BUILD_NUMBER=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          cd build
          mkdir -p Payload
          cp -R Bani.xcarchive/Products/Applications/Bani.app Payload/
          zip -qr Bani-unsigned.ipa Payload
          ls -la Bani-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Bani-unsigned-ipa
          path: build/Bani-unsigned.ipa
          if-no-files-found: error

  # ── STAGE 2 — Appetize browser preview (non-blocking) ───────────────────────
  # Runs ONLY after gate is green, push-to-main only. Builds a zipped iOS
  # SIMULATOR .app (Appetize accepts ONLY simulator .app bundles — a device .ipa
  # is unsupported) and uploads it so every push to main gets a click-to-run
  # browser preview. `continue-on-error: true` keeps a preview failure from ever
  # blocking the pipeline, and this job is deliberately ABSENT from `release`'s
  # needs, so it can never gate a release. The Appetize publicKey is persisted in
  # a committed `.appetize` file; if that file is ever lost the same app is
  # re-found by its note (bani-ci-preview) so a duplicate URL is never minted.
  # The permanent preview URL is https://appetize.io/app/<publicKey> (publicKey
  # stored in `.appetize`); every push to main re-uploads to that same app.
  preview:
    name: preview (Appetize browser preview)
    needs: [gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: macos-26
    continue-on-error: true
    permissions:
      contents: write
    env:
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
      APPETIZE_NOTE: bani-ci-preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0   # full history so the persist step can rebase onto main

      - name: Guard — require Appetize token (warn + skip, never fail)
        id: guard
        run: |
          if [ -z "${APPETIZE_API_TOKEN:-}" ]; then
            echo "::warning::APPETIZE_API_TOKEN not set — skipping Appetize preview (non-blocking)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select newest Xcode
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode_2*.app 2>/dev/null | sort -V | tail -1); fi
          sudo xcode-select -s "$XC/Contents/Developer"

      - name: Install XcodeGen
        if: steps.guard.outputs.run == 'true'
        run: brew install xcodegen

      - name: Cache SwiftPM checkouts
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            build/DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: bani-spm-${{ runner.os }}-${{ hashFiles('project.yml', '**/Package.resolved') }}
          restore-keys: |
            bani-spm-${{ runner.os }}-

      - name: Generate Xcode project
        if: steps.guard.outputs.run == 'true'
        run: xcodegen generate

      - name: Build simulator .app (Debug)
        if: steps.guard.outputs.run == 'true'
        run: |
          set -o pipefail
          # Appetize accepts ONLY a zipped iOS Simulator .app bundle; a device .ipa
          # is not supported. Build the Debug simulator slice (no signing needed).
          xcodebuild build \
            -project Bani.xcodeproj \
            -scheme Bani \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Zip the simulator .app
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/Bani.app"
          ls -la "build/DerivedData/Build/Products/Debug-iphonesimulator"
          test -d "$APP"
          # ditto --keepParent → the zip's root entry is Bani.app (what Appetize wants),
          # and ditto preserves bundle symlinks/permissions a plain zip can mangle.
          ditto -c -k --keepParent "$APP" build/Bani-sim.zip
          ls -la build/Bani-sim.zip

      - name: Upload to Appetize
        id: upload
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          API="https://api.appetize.io/v1"
          ZIP="build/Bani-sim.zip"
          NOTE="$APPETIZE_NOTE"

          # 1) Resolve the target app's publicKey.
          PUBLICKEY=""
          if [ -f .appetize ]; then
            PUBLICKEY="$(tr -d ' \t\r\n' < .appetize)"
            echo "publicKey from committed .appetize: $PUBLICKEY"
          fi

          # Self-healing backstop: .appetize missing → find the SAME app by its note
          # (never mint a duplicate). Fall back to the sole iOS app if note isn't matched.
          if [ -z "$PUBLICKEY" ]; then
            echo "No .appetize — searching existing apps for note=$NOTE"
            : > build/apps.ndjson
            NEXT=""
            while : ; do
              if [ -n "$NEXT" ] && [ "$NEXT" != "null" ]; then URL="$API/apps?nextKey=$NEXT"; else URL="$API/apps"; fi
              RESP="$(curl -sS -H "X-API-KEY: $APPETIZE_API_TOKEN" "$URL")"
              echo "$RESP" | jq -c '.data[]?' >> build/apps.ndjson || true
              HAS="$(echo "$RESP" | jq -r '.hasMore // false')"
              NEXT="$(echo "$RESP" | jq -r '.nextKey // ""')"
              { [ "$HAS" = "true" ] && [ -n "$NEXT" ] && [ "$NEXT" != "null" ]; } || break
            done
            PUBLICKEY="$(jq -rs --arg n "$NOTE" 'map(select(.note==$n)) | (.[0].publicKey // "")' build/apps.ndjson)"
            if [ -z "$PUBLICKEY" ] || [ "$PUBLICKEY" = "null" ]; then
              IOS_N="$(jq -rs 'map(select(.platform=="ios")) | length' build/apps.ndjson)"
              if [ "$IOS_N" = "1" ]; then
                PUBLICKEY="$(jq -rs 'map(select(.platform=="ios")) | .[0].publicKey' build/apps.ndjson)"
                echo "::warning::.appetize missing and no note match; re-bound to the sole iOS app ($PUBLICKEY) to avoid a duplicate."
              else
                PUBLICKEY=""
                echo "No existing preview app found — a new one will be created."
              fi
            else
              echo "Re-bound to existing app by note: $PUBLICKEY"
            fi
          fi

          # 2) Upload: update the existing app, or create a new one on first run.
          if [ -n "$PUBLICKEY" ]; then
            echo "Updating Appetize app $PUBLICKEY"
            TARGET="$API/apps/$PUBLICKEY"; NEW=0
          else
            echo "Creating new Appetize app"
            TARGET="$API/apps"; NEW=1
          fi
          RESP="$(curl -sS -w $'\n%{http_code}' -X POST "$TARGET" \
            -H "X-API-KEY: $APPETIZE_API_TOKEN" \
            -F "file=@$ZIP" \
            -F "platform=ios" \
            -F "fileType=zip" \
            -F "note=$NOTE")"
          CODE="$(printf '%s' "$RESP" | tail -1)"
          BODY="$(printf '%s' "$RESP" | sed '$d')"
          echo "HTTP $CODE"
          printf '%s\n' "$BODY" | jq . || printf '%s\n' "$BODY"

          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            # Real failure — surface it (do NOT let continue-on-error hide it). A 4xx
            # on a simulator .app zip is a structural rejection worth stopping for.
            echo "::error::Appetize upload failed (HTTP $CODE). Body above."
            exit 1
          fi

          PK="$(printf '%s' "$BODY" | jq -r '.publicKey')"
          UPD="$(printf '%s' "$BODY" | jq -r '.updated')"
          VC="$(printf '%s' "$BODY" | jq -r '.versionCode')"
          if [ -z "$PK" ] || [ "$PK" = "null" ]; then
            echo "::error::Appetize response contained no publicKey."
            exit 1
          fi
          echo "publickey=$PK" >> "$GITHUB_OUTPUT"
          echo "updated=$UPD" >> "$GITHUB_OUTPUT"
          echo "versioncode=$VC" >> "$GITHUB_OUTPUT"
          echo "new_app=$NEW" >> "$GITHUB_OUTPUT"
          echo "preview_url=https://appetize.io/app/$PK" >> "$GITHUB_OUTPUT"
          echo "Preview URL: https://appetize.io/app/$PK (versionCode $VC, updated $UPD)"

      - name: Persist publicKey (.appetize) + README link
        if: steps.guard.outputs.run == 'true' && steps.upload.outputs.publickey != ''
        run: |
          set -euo pipefail
          PK="${{ steps.upload.outputs.publickey }}"
          URL="https://appetize.io/app/$PK"
          CHANGED=0
          if [ ! -f .appetize ] || [ "$(tr -d ' \t\r\n' < .appetize)" != "$PK" ]; then
            printf '%s\n' "$PK" > .appetize
            CHANGED=1
          fi
          if grep -q "appetize.io/app/" README.md 2>/dev/null; then
            :
          else
            printf '\n▶ **Live preview (Appetize):** %s — runs the latest `main` build in your browser.\n' "$URL" >> README.md
            CHANGED=1
          fi
          if [ "$CHANGED" = "0" ]; then
            echo ".appetize + README already current — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .appetize README.md
          git commit -m "ci: persist Appetize preview publicKey + README link [skip ci]"
          # Rebase-retry loop so this can't lose a race with the release job's own
          # commit to main. [skip ci] keeps the push from re-triggering the pipeline.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Persisted on attempt $i."
              exit 0
            fi
            echo "push rejected — fetching + rebasing (attempt $i)"
            git fetch origin main
            git rebase origin/main || git rebase --abort
          done
          echo "::warning::Could not persist .appetize/README after 5 attempts; it will persist on the next run."
          exit 0

      - name: Preview summary
        if: steps.guard.outputs.run == 'true' && steps.upload.outputs.publickey != ''
        run: |
          {
            echo "### ▶ Appetize preview"
            echo ""
            echo "▶ Preview: ${{ steps.upload.outputs.preview_url }}"
            echo ""
            echo "- version (versionCode): ${{ steps.upload.outputs.versioncode }}"
            echo "- updated: ${{ steps.upload.outputs.updated }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ── STAGE 3 — release ───────────────────────────────────────────────────────
  # Publishes only when gate + screenshots + ipa are all green. Because a
  # non-blocking UI flake still leaves `screenshots` green, a flake does not stop
  # a release; a ManualEntryUITests failure fails `screenshots` and does. The
  # source.json / AltStore flow below is unchanged from before the restructure.
  release:
    name: release (GitHub Release + AltStore source)
    needs: [gate, screenshots, ipa]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: macos-26
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Bani-unsigned-ipa
          path: dist

      - name: Prepare Bani.ipa + release facts
        id: facts
        run: |
          set -euo pipefail
          cp dist/Bani-unsigned.ipa Bani.ipa
          RUN="${{ github.run_number }}"
          VERSION="1.0"
          TAG="v${VERSION}.${RUN}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SIZE="$(stat -f%z Bani.ipa)"
          REPO="${{ github.repository }}"
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${TAG}/Bani.ipa"
          {
            echo "run=${RUN}"
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "date=${DATE}"
            echo "size=${SIZE}"
            echo "download_url=${DOWNLOAD_URL}"
          } >> "$GITHUB_OUTPUT"
          echo "Prepared ${TAG}: ${SIZE} bytes -> ${DOWNLOAD_URL}"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.facts.outputs.tag }}" Bani.ipa \
            --repo "${{ github.repository }}" \
            --title "Bani ${{ steps.facts.outputs.version }} (${{ steps.facts.outputs.run }})" \
            --notes "Automated release. CFBundleVersion ${{ steps.facts.outputs.run }}. Voice-pipeline fix: entries are never silently dropped. Install/update via AltStore." \
            --latest

      - name: Update AltStore source.json
        env:
          # Passed via env (not interpolated into the script body) — commit
          # messages are attacker-influenceable content; direct interpolation
          # into a run: block is a GitHub Actions script-injection vector.
          COMMIT_SUBJECT_RAW: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          ICON_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/docs/icon.png"
          # First line of the triggering commit message, JSON-escaped by jq --arg below.
          COMMIT_SUBJECT="$(printf '%s\n' "${COMMIT_SUBJECT_RAW:-Automated release.}" | head -1)"
          jq \
            --arg build "${{ steps.facts.outputs.run }}" \
            --arg date "${{ steps.facts.outputs.date }}" \
            --arg url "${{ steps.facts.outputs.download_url }}" \
            --argjson size ${{ steps.facts.outputs.size }} \
            --arg icon "$ICON_URL" \
            --arg desc "$COMMIT_SUBJECT" \
            '.iconURL = $icon
             | .apps[0].iconURL = $icon
             | .apps[0].versions[0] = {
                 version: ("1.0." + $build),
                 buildVersion: $build,
                 date: $date,
                 localizedDescription: $desc,
                 downloadURL: $url,
                 size: $size,
                 minOSVersion: "26.0"
               }' docs/source.json > docs/source.json.tmp
          mv docs/source.json.tmp docs/source.json
          echo "---- docs/source.json ----"
          cat docs/source.json
          jq -e . docs/source.json > /dev/null && echo "source.json is valid JSON"

      - name: Commit source.json to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/source.json
          if git diff --cached --quiet; then
            echo "source.json unchanged — nothing to commit"
          else
            # [skip ci] prevents this push from re-triggering the workflow.
            git commit -m "chore(release): AltStore source for ${{ steps.facts.outputs.tag }} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Enable GitHub Pages (best-effort)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages" \
            -f "source[branch]=main" -f "source[path]=/docs" \
            && echo "GitHub Pages enabled for main /docs" \
            || echo "Pages already enabled or not permitted — raw URL remains the stable source URL"

      - name: Verify published artifacts (B4)
        run: |
          set -uo pipefail
          RAW_SOURCE="https://raw.githubusercontent.com/${{ github.repository }}/main/docs/source.json"
          IPA_URL="${{ steps.facts.outputs.download_url }}"
          echo "==== B4: curl -I IPA asset (expect 302 then 200, no auth) ===="
          curl -sIL "$IPA_URL" | grep -iE '^HTTP|^location' || true
          IPA_CODE="$(curl -s -o /dev/null -w '%{http_code}' -IL "$IPA_URL")"
          echo "IPA final HTTP status: ${IPA_CODE}"
          echo ""
          echo "==== B4: curl source.json (raw, stable public URL) ===="
          SRC_CODE="$(curl -s -L "$RAW_SOURCE" -o fetched-source.json -w '%{http_code}')"
          echo "source.json HTTP status: ${SRC_CODE}"
          echo "---- served source.json ----"
          cat fetched-source.json || true
          echo ""
          if jq -e . fetched-source.json > /dev/null 2>&1; then
            echo "served source.json is valid JSON"
          else
            echo "served copy not yet CDN-propagated; the committed local copy was validated in the previous step"
          fi
          echo ""
          echo "Stable source URL: ${RAW_SOURCE}"
